<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Manage</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{
display:flex;justify-content:center;align-items:center;
background:linear-gradient(135deg,#07111f,#12233f,#0d1728);
color:#fff;
}
.container{width:min(900px,95vw);text-align:center}
.logo{animation:drop .9s ease}
.logo h1{font-size:3rem}
.logo span{color:#42d67d}
.sub{opacity:.85;margin-top:8px}
.dev{margin:16px auto 30px;padding:10px 18px;border:1px solid #355;display:inline-block;border-radius:999px}
.apps{display:flex;flex-direction:column;gap:16px}
.card{
position:relative;display:flex;align-items:center;gap:18px;
padding:20px;border-radius:22px;text-decoration:none;color:#fff;
background:#17253f;border:1px solid #2d456d;
transform:translateY(25px);opacity:0;
animation:rise .7s ease forwards;
overflow:hidden;
}
.card:nth-child(1){animation-delay:.5s}
.card:nth-child(2){animation-delay:.9s}
.card:nth-child(3){animation-delay:1.3s}

.card::after{
content:"";
position:absolute;
top:0;left:-120%;
width:80%;height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
animation:sweep 4s linear infinite;
}
.card:nth-child(2)::after{animation-delay:1.3s}
.card:nth-child(3)::after{animation-delay:2.6s}

.icon{
width:72px;height:72px;border-radius:18px;
display:flex;align-items:center;justify-content:center;
font-weight:bold;font-size:28px;flex-shrink:0
}
.staff{background:linear-gradient(135deg,#0dbd57,#5ff0a0)}
.cmv{background:linear-gradient(135deg,#15a64a,#3bdd73);font-size:15px;line-height:1.1;flex-direction:column}
.fila{background:linear-gradient(135deg,#1b63d1,#49a3ff)}
.info{text-align:left}
.name{font-size:1.2rem;font-weight:700}
.desc{opacity:.8;font-size:.9rem;margin-top:4px}
.footer{margin-top:22px;opacity:.75}

@keyframes drop{from{opacity:0;transform:translateY(-35px)}to{opacity:1;transform:none}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes sweep{0%{left:-120%}100%{left:140%}}

@media(max-width:700px){
.logo h1{font-size:2.2rem}
.icon{width:60px;height:60px}
.name{font-size:1rem}
.desc{font-size:.8rem}
}
</style>
</head>
<body>
<div class="container">
<div class="logo">
<h1>SMART <span>MANAGE</span></h1>
<div class="sub">Sistema Unificado de Gestão</div>
<div class="dev">Desenvolvido por Heitor Serra Neto</div>
</div>

<div class="apps">
<a class="card" href="https://heitorserra-81.github.io/Checklist/">
<div class="icon staff">✓</div>
<div class="info">
<div class="name">STAFF CHECK</div>
<div class="desc">Gestão de equipes e checklist operacional</div>
</div>
</a>

<a class="card" href="https://heitorserra-81.github.io/CMV-LEGAL/">
<div class="icon cmv"><div>CMV</div><div>LEGAL</div></div>
<div class="info">
<div class="name">CMV LEGAL</div>
<div class="desc">Controle de estoque, custos e indicadores</div>
</div>
</a>

<a class="card" href="https://heitorserra-81.github.io/VAPT-FILA/">
<div class="icon fila">≡</div>
<div class="info">
<div class="name">SMART FILA</div>
<div class="desc">Gerencie filas. Encante clientes.</div>
</div>
</a>
</div>

<div class="footer">© 2026 • Smart Manage</div>
</div>
</body>
</html>
