<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Smart Manage | Heitor Serra Neto</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f1a;
      background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative;
      padding: 20px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .brand h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 900;
      font-size: 2.8rem;
      color: #facc15;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(250,204,21,0.3);
      line-height: 1.1;
    }
    .brand h1 span {
      color: #10b981;
    }
    .brand .sub {
      font-size: 1rem;
      color: #cbd5e1;
      font-weight: 500;
      margin-top: 0.3rem;
    }
    .developer {
      font-size: 0.95rem;
      color: #cbd5e1;
      font-weight: 600;
      background: rgba(0,0,0,0.4);
      padding: 0.4rem 1.5rem;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      margin-bottom: 0.5rem;
    }
    .apps {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }
    .app-btn {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .app-btn:hover {
      transform: translateY(-4px);
      border-color: #facc15;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }
    .app-btn .icon {
      font-size: 2.8rem;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
      flex-shrink: 0;
      width: 60px;
      text-align: center;
    }
    .app-btn .info {
      text-align: left;
      flex: 1;
    }
    .app-btn .name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .app-btn .desc {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }
    .app-btn.staff { border-left: 4px solid #10b981; }
    .app-btn.cmv   { border-left: 4px solid #f4a261; }
    .app-btn.vapt  { border-left: 4px solid #0077b6; }
    .footer-note {
      color: #64748b;
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }
    @media (max-width: 480px) {
      .brand h1 { font-size: 2.2rem; }
      .app-btn { padding: 1rem 1.2rem; }
      .app-btn .icon { font-size: 2.2rem; width: 45px; }
      .app-btn .name { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1>SMART <span>MANAGE</span></h1>
      <div class="sub">Sistema Integrado de Gestão</div>
    </div>
    <div class="developer">👨‍💼 Desenvolvido por Heitor Serra Neto</div>

    <div class="apps">
      <!-- Staff Check -->
      <a href="https://heitorserra-81.github.io/Checklist/" class="app-btn staff">
        <div class="icon">👥</div>
        <div class="info">
          <div class="name">Staff Check</div>
          <div class="desc">Gestão de equipe e controle de turno</div>
        </div>
      </a>

      <!-- CMV Legal -->
      <a href="https://heitorserra-81.github.io/CMV-LEGAL/" class="app-btn cmv">
        <div class="icon">🍔</div>
        <div class="info">
          <div class="name">CMV Legal</div>
          <div class="desc">Gestão operacional, estoque e custos</div>
        </div>
      </a>

      <!-- Vapt Fila -->
      <a href="https://heitorserra-81.github.io/VAPT-FILA/" class="app-btn vapt">
        <div class="icon">🪑</div>
        <div class="info">
          <div class="name">Vapt Fila</div>
          <div class="desc">Fila de espera e mesas inteligentes</div>
        </div>
      </a>
    </div>

    <div class="footer-note">Smart Manage · Todos os direitos reservados © 2026</div>
  </div>
</body>
</html>
